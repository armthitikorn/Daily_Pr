<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวสร้างโปสเตอร์ Course Information</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&family=Caveat:wght@600&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:#eef1f3;color:#222}
.wrap{display:flex;gap:20px;padding:20px;max-width:1500px;margin:0 auto;align-items:flex-start;flex-wrap:wrap}
.form{flex:1 1 340px;max-width:460px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.form h2{margin:0 0 12px;font-size:20px;color:#d71920}
.form h3{margin:16px 0 6px;font-size:15px;color:#337ab7;border-bottom:1px solid #eee;padding-bottom:4px}
.form label{display:block;font-size:13px;color:#555;margin-top:8px}
.form input[type=text],.form textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:6px;font:inherit;font-size:15px}
.form input[type=file]{width:100%;font-size:13px;margin-top:3px}
button{background:#d71920;color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;margin-top:16px}
.prev{flex:2 1 500px;min-width:300px}
#fit{width:100%;position:relative}
#stage{width:1024px;height:1536px;transform-origin:0 0;position:absolute;left:0;top:0}
/* ===== poster ===== */
#poster{position:relative;width:1024px;height:1536px;background:#f3f4f6;overflow:hidden;font-family:'Sarabun',sans-serif;color:#222}
#poster .a{position:absolute}
.ph{position:absolute;overflow:hidden;background:#d5d8dc}
.in{position:absolute;inset:0;background:center/cover no-repeat;transform-origin:center}
.sc{font-family:'Caveat',cursive;line-height:1.1;white-space:pre-line}
.row{position:absolute;display:flex;align-items:center;height:72px}
.ci{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#e8262d,#b3121a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-style:normal;flex:none}
.lb{width:125px;height:66px;background:linear-gradient(90deg,#e6e6e9,#f4f4f6);display:flex;align-items:center;padding-left:22px;font-size:18px;color:#555;white-space:pre-line;line-height:1.1;flex:none;margin-left:-6px;padding-left:28px}
.v{height:66px;display:flex;align-items:center;padding-left:16px;font-weight:700;font-size:26px;line-height:1.15;white-space:pre-line;color:#1b1b1b}
</style>
</head>
<body>
<div class="wrap">
  <div class="form">
    <h2>🖼️ ตัวสร้างโปสเตอร์ Course Information</h2>
    <div id="fields"></div>
    <h3>รูปภาพ</h3>
    <label>รูปบรรยากาศด้านบน (ใหญ่)<input type="file" accept="image/*" data-img="hero"></label>
    <label>รูปบรรยากาศด้านล่าง<input type="file" accept="image/*" data-img="bot"></label>
    <label>รูปวิทยากร<input type="file" accept="image/*" data-img="trn"></label>
    <button id="dl">⬇️ ดาวน์โหลดเป็น PNG</button>
  </div>

  <div class="prev"><div id="fit"><div id="stage">
  <div id="poster">
    <!-- ส่วนหัว -->
    <div class="a" style="left:0;top:0;width:1024px;height:128px;background:linear-gradient(#fff,#eceef1)"></div>
    <div class="a" style="left:250px;top:44px;font-size:32px;font-weight:800;color:#d71920;line-height:1">PRU <span style="font-weight:400;color:#444">ACADEMY</span></div>
    <div class="a" style="left:252px;top:86px;font-size:11px;letter-spacing:3.2px;color:#555">LEARN · GROW · SUCCEED</div>
    <div class="a" style="left:495px;top:26px;width:1px;height:76px;background:#bbb"></div>
    <div class="a" style="left:518px;top:30px;line-height:1.05;font-weight:800;font-size:24px;color:#d71920">DISTRIBUTION<br><span style="color:#333">ACADEMY TEAM</span></div>
    <div class="a" style="left:518px;top:88px;font-size:8px;color:#555;letter-spacing:.3px">PEOPLE DEVELOPMENT FOR A STRONGER TOMORROW</div>
    <div class="a" style="left:733px;top:26px;width:1px;height:76px;background:#bbb"></div>
    <div class="a" style="left:756px;top:60px;font-size:30px;font-weight:800;color:#d71920;line-height:1">PRUDENTIAL</div>
    <div class="a" style="left:758px;top:94px;font-size:18px;color:#333;line-height:1">พรูเด็นเชียล ประเทศไทย</div>
    <svg class="a" style="left:0;top:0" width="170" height="170" viewBox="0 0 170 170"><polygon points="0,0 170,0 0,170" fill="#d71920" opacity=".92"/><polygon points="0,0 90,0 0,90" fill="#8f0d13"/></svg>

    <!-- รูปบน -->
    <div class="ph" id="hero" style="left:0;top:128px;width:1024px;height:374px"><div class="in"></div><div class="a" style="inset:0;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,0) 55%)"></div></div>
    <svg class="a" style="left:0;top:128px" width="330" height="300" viewBox="0 0 330 300"><polygon points="0,0 330,0 0,300" fill="#222" opacity=".32"/></svg>
    <svg class="a" style="left:0;top:330px" width="130" height="172" viewBox="0 0 130 172"><polygon points="0,172 0,30 130,172" fill="#d71920"/></svg>
    <svg class="a" style="left:894px;top:300px" width="130" height="202" viewBox="0 0 130 202"><polygon points="130,0 130,202 0,202" fill="#d71920"/></svg>
    <div class="a sc" data-fit="170,38,16" style="left:42px;top:190px;width:190px;font-size:38px;color:#fff;transform:rotate(-17deg)" data-k="s1"></div>
    <div class="a" data-fit="110,22,11" style="left:832px;top:182px;width:190px;font-size:22px;line-height:1.15;color:#fff;white-space:pre-line;letter-spacing:.5px" data-k="s2"></div>

    <!-- แบนเนอร์ -->
    <svg class="a" style="left:215px;top:470px" width="335" height="36" viewBox="0 0 335 36"><polygon points="0,0 335,0 318,36 15,36" fill="#1d1d27"/></svg>
    <div class="a" style="left:215px;top:474px;width:335px;text-align:center;color:#fff;font-size:22px;letter-spacing:4px;line-height:1.2">COURSE INFORMATION</div>
    <svg class="a" style="left:0;top:500px" width="1024" height="165" viewBox="0 0 1024 165"><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#b3121a"/><stop offset=".5" stop-color="#e8262d"/><stop offset="1" stop-color="#a50f17"/></linearGradient></defs><polygon points="0,18 1024,0 1024,150 0,165" fill="url(#g1)"/><polygon points="0,18 320,10 150,160 0,165" fill="#fff" opacity=".08"/></svg>
    <div class="a" data-fit="58,50,20" style="left:32px;top:516px;width:960px;text-align:center;color:#fff;font-size:50px;font-weight:800;font-style:italic;line-height:1.2;white-space:nowrap" data-k="b1"></div>
    <div class="a" data-fit="58,46,18" style="left:32px;top:563px;width:960px;text-align:center;color:#fff;font-size:46px;font-weight:800;line-height:1.3;white-space:nowrap" data-k="b2"></div>
    <div class="a" data-fit="58,46,18" style="left:32px;top:610px;width:960px;text-align:center;color:#fff;font-size:46px;font-weight:800;font-style:italic;line-height:1.3;white-space:nowrap" data-k="b3"></div>

    <!-- ตารางข้อมูล -->
    <div class="a" style="left:25px;top:678px;width:975px;height:347px;background:#fff;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.1)"></div>
    <div class="a" style="left:524px;top:696px;width:2px;height:304px;background:#e3e3e6"></div>
    <div id="rows"></div>

    <!-- รูปล่าง + วิทยากร -->
    <div class="ph" id="bot" style="left:0;top:1037px;width:690px;height:378px"><div class="in"></div><div class="a" style="left:0;right:0;bottom:0;height:150px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.45))"></div></div>
    <svg class="a" style="left:560px;top:1037px" width="464" height="378" viewBox="0 0 464 378"><defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#e9ebee"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><polygon points="125,0 464,0 464,378 0,378" fill="url(#g2)"/></svg>
    <svg class="a" style="left:0;top:1037px" width="110" height="110" viewBox="0 0 110 110"><polygon points="0,0 110,0 0,110" fill="#d71920"/></svg>
    <div class="a sc" data-fit="120,36,16" style="left:38px;top:1272px;width:250px;font-size:36px;color:#fff;transform:rotate(-12deg)" data-k="s3"></div>
    <div class="ph" id="trn" style="left:640px;top:1040px;width:340px;height:330px;background:#e9ebee"><div class="in" style="background-position:center top"></div></div>
    <div class="a" style="left:895px;top:1052px;font-size:17px;letter-spacing:3px;color:#333">TRAINER</div>
    <div class="a" style="left:895px;top:1076px;width:60px;height:2px;background:#d71920"></div>
    <div class="a sc" data-fit="130,26,12" style="left:892px;top:1104px;width:130px;font-size:26px;color:#222;transform:rotate(-12deg)" data-k="s4"></div>
    <svg class="a" style="left:690px;top:1328px" width="300" height="68" viewBox="0 0 300 68"><polygon points="20,0 300,0 280,68 0,68" fill="#c4161c"/><polygon points="20,0 120,0 100,68 0,68" fill="#e8262d" opacity=".6"/></svg>
    <div class="a" data-fit="50,28,13" style="left:715px;top:1340px;width:250px;text-align:center;color:#fff;font-size:28px;font-weight:700;line-height:1.4;white-space:nowrap" data-k="tname"></div>

    <!-- ท้าย -->
    <div class="a" style="left:0;top:1415px;width:1024px;height:121px;background:linear-gradient(90deg,#a50f17,#e8262d 55%,#b3121a)"></div>
    <div class="a" data-fit="26,15,9" style="left:38px;top:1460px;width:720px;color:#fff;font-size:15px;letter-spacing:2px;white-space:pre" data-k="fl"></div>
    <div class="a" style="left:800px;top:1470px;width:70px;height:2px;background:#fff"></div>
    <div class="a" data-fit="80,18,10" style="left:896px;top:1438px;width:120px;color:#fff;font-size:18px;font-weight:700;line-height:1.1;white-space:pre-line" data-k="fr"></div>
  </div></div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const F = [
  ['ข้อความบนรูปด้านบน'],
  ['s1','ข้อความลายมือ (ซ้ายบน)','Learning\nToday\nfor a Brighter\nTomorrow','area'],
  ['s2','ข้อความตัวพิมพ์ใหญ่ (ขวาบน)','PEOPLE\nDEVELOPMENT\nFOR A STRONGER\nTOMORROW','area'],
  ['แบนเนอร์หัวข้อ'],
  ['b1','บรรทัด 1','DAY4_New TSR'],
  ['b2','บรรทัด 2','ความรู้และทักษะการนำเสนอผลิตภัณฑ์'],
  ['b3','บรรทัด 3','PRUMhao Mhao'],
  ['รายละเอียดหลักสูตร'],
  ['course','Course','DAY4_New TSR -\nความรู้และทักษะการนำเสนอ\nผลิตภัณฑ์ PRUMhao Mhao','area'],
  ['place','Place','Siripinyo'],
  ['date','Date','25 Nov 26'],
  ['time','Time','9.00-17.00'],
  ['pax','Pax','11'],
  ['trainer','Trainer','Thitikorn'],
  ['cat','Category','Basic'],
  ['method','Training Method','Knowledge'],
  ['ส่วนล่าง'],
  ['s3','ข้อความลายมือบนรูปล่าง','Build People\nBetter Tomorrow','area'],
  ['s4','ข้อความลายมือข้างวิทยากร','Build\nKnowledge\nCreate Impact','area'],
  ['tname','ชื่อบนแถบแดง','Thitikorn (Arm)'],
  ['fl','ข้อความท้ายซ้าย','PRUDENTIAL THAILAND  |  PRU ACADEMY  |  DISTRIBUTION ACADEMY TEAM'],
  ['fr','ข้อความท้ายขวา','WE DO\nBETTER\nTOGETHER','area']
];
const data = {}, box = document.getElementById('fields');
F.forEach(f => {
  if (f.length === 1) { box.insertAdjacentHTML('beforeend', '<h3>' + f[0] + '</h3>'); return; }
  const [k, label, def, type] = f; data[k] = def;
  const el = document.createElement('label'); el.textContent = label;
  const inp = document.createElement(type === 'area' ? 'textarea' : 'input');
  if (type === 'area') inp.rows = 3; else inp.type = 'text';
  inp.value = def; inp.oninput = () => { data[k] = inp.value; render(); };
  el.append(inp); box.append(el);
});

// แถวข้อมูล [x, y, ไอคอน, ป้าย, key, ความกว้างค่า]
const ROWS = [
  [45, 692, '📖', 'Course', 'course', 262], [45, 775, '📍', 'Place', 'place', 262],
  [45, 857, '📅', 'Date', 'date', 262], [45, 939, '🕒', 'Time', 'time', 262],
  [553, 692, '👥', 'Pax', 'pax', 205], [553, 775, '👤', 'Trainer', 'trainer', 205],
  [553, 857, '📊', 'Category', 'cat', 205], [553, 939, '🎓', 'Training\nMethod', 'method', 205]
];
document.getElementById('rows').innerHTML = ROWS.map(r =>
  '<div class="row" style="left:' + r[0] + 'px;top:' + r[1] + 'px"><i class="ci">' + r[2] + '</i><div class="lb">' + r[3] +
  '</div><div class="v" data-fit="64,26,11" style="width:' + r[5] + 'px" data-k="' + r[4] + '"></div></div>').join('');

function fitAll() {
  document.querySelectorAll('[data-fit]').forEach(el => {
    const [h, st, mn] = el.dataset.fit.split(',').map(Number);
    let s = st; el.style.fontSize = s + 'px';
    while ((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > h) && s > mn) { s--; el.style.fontSize = s + 'px'; }
  });
}
function render() {
  document.querySelectorAll('[data-k]').forEach(e => { e.textContent = data[e.dataset.k] ?? ''; });
  fitAll();
}
render();
if (document.fonts) document.fonts.ready.then(render);

// อัปโหลดรูป + ซูม/เลื่อน
const T = {};
document.querySelectorAll('[data-img]').forEach(inp => {
  const k = inp.dataset.img, inEl = () => document.querySelector('#' + k + ' .in');
  T[k] = { z: 100, x: 0, y: 0 };
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { inEl().style.backgroundImage = 'url(' + r.result + ')'; };
    r.readAsDataURL(f);
  };
  const bx = document.createElement('div');
  bx.style.cssText = 'font-size:12px;color:#777;display:grid;grid-template-columns:70px 1fr;gap:2px 8px;margin-top:4px';
  [['ซูม', 'z', 100, 300], ['ซ้าย-ขวา', 'x', -50, 50], ['บน-ล่าง', 'y', -50, 50]].forEach(([n, pr, mn, mx]) => {
    const l = document.createElement('span'); l.textContent = n;
    const sl = document.createElement('input'); sl.type = 'range'; sl.min = mn; sl.max = mx; sl.value = T[k][pr];
    sl.oninput = () => { T[k][pr] = +sl.value; inEl().style.transform = 'translate(' + T[k].x + '%,' + T[k].y + '%) scale(' + T[k].z / 100 + ')'; };
    bx.append(l, sl);
  });
  inp.parentElement.after(bx);
});

// ย่อพรีวิวให้พอดีหน้าจอ
const fit = document.getElementById('fit'), stage = document.getElementById('stage');
const resize = () => { const s = Math.min(1, fit.clientWidth / 1024); stage.style.transform = 'scale(' + s + ')'; fit.style.height = (1536 * s) + 'px'; };
window.addEventListener('resize', resize); resize();

// ดาวน์โหลด PNG
document.getElementById('dl').onclick = async () => {
  if (!window.html2canvas) return alert('โหลดตัวสร้างรูปไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต');
  const old = stage.style.transform; stage.style.transform = 'none';
  try {
    if (document.fonts) await document.fonts.ready;
    const c = await html2canvas(document.getElementById('poster'), { scale: 2, useCORS: true, backgroundColor: '#fff' });
    const a = document.createElement('a'); a.download = 'poster.png'; a.href = c.toDataURL('image/png'); a.click();
  } catch (e) { alert('สร้างรูปไม่สำเร็จ: ' + e.message); }
  stage.style.transform = old;
};
</script>
</body>
</html>
